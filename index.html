<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b10" />
  <title>Emoji-fied</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤩</text></svg>" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>emoji<span>·</span>fied</h1>
    <span id="fps" class="fps" aria-live="off"></span>
  </header>

  <main>
    <div class="stage" id="stage">
      <canvas id="out" aria-label="Camera rendered as emoji or unicode characters"></canvas>
      <video id="video" playsinline muted autoplay></video>

      <div class="overlay" id="overlay">
        <div class="overlay-card">
          <div class="big">😀🔥🌈</div>
          <p>Turn your camera into emoji &amp; unicode art.</p>
          <button id="start" class="primary">Start camera</button>
          <p class="error" id="error" role="alert"></p>
          <p class="note">Everything runs in your browser. No video leaves your device.</p>
        </div>
      </div>
    </div>

    <section class="controls" aria-label="Filter controls">
      <label class="field">
        <span>Style</span>
        <select id="style">
          <optgroup label="Emoji">
            <option value="emoji:everything" selected>Everything</option>
            <option value="emoji:rainbow">Rainbow</option>
            <option value="emoji:faces">Faces</option>
            <option value="emoji:food">Food</option>
            <option value="emoji:nature">Nature</option>
            <option value="emoji:animals">Animals</option>
            <option value="emoji:hearts">Hearts</option>
          </optgroup>
          <optgroup label="Unicode">
            <option value="text:ascii">ASCII</option>
            <option value="text:detailed">ASCII (detailed)</option>
            <option value="text:blocks">Blocks ░▒▓█</option>
            <option value="text:shapes">Shapes ·○◎●</option>
            <option value="text:stars">Stars ✧✦★</option>
            <option value="text:math">Math ∴∷≡⊠</option>
            <option value="text:katakana">Katakana ｱｶｻ</option>
            <option value="braille">Braille ⠿</option>
          </optgroup>
          <optgroup label="Your own">
            <option value="custom">Custom…</option>
          </optgroup>
        </select>
      </label>

      <label class="field" id="customField" hidden>
        <span>Characters</span>
        <input id="custom" type="text" value="🐸🍀💚🌿🟩" autocomplete="off" spellcheck="false" />
      </label>

      <label class="field">
        <span>Detail <output id="colsOut"></output></span>
        <input id="cols" type="range" min="16" max="180" value="64" />
      </label>

      <label class="field" id="matchField">
        <span>Match by</span>
        <select id="match">
          <option value="color">Color</option>
          <option value="brightness">Brightness</option>
        </select>
      </label>

      <label class="field" id="colorField" hidden>
        <span>Ink</span>
        <select id="ink">
          <option value="full">Full color</option>
          <option value="#39ff7a">Matrix green</option>
          <option value="#f2f2f2">White</option>
          <option value="#ffb000">Amber</option>
          <option value="#5ec8ff">Cyan</option>
          <option value="#ff4fd8">Magenta</option>
        </select>
      </label>

      <label class="field">
        <span>Contrast <output id="contrastOut"></output></span>
        <input id="contrast" type="range" min="0.5" max="3" step="0.05" value="1.2" />
      </label>

      <label class="field">
        <span>Brightness <output id="brightOut"></output></span>
        <input id="bright" type="range" min="-0.5" max="0.5" step="0.01" value="0" />
      </label>

      <div class="toggles">
        <label><input id="mirror" type="checkbox" checked /> Mirror</label>
        <label><input id="invert" type="checkbox" /> Invert</label>
        <label id="blankField"><input id="blank" type="checkbox" checked /> Blank darks</label>
      </div>

      <div class="buttons">
        <button id="flip" title="Switch between front and back camera">🔄 Flip</button>
        <button id="pause" title="Freeze the frame">⏸ Pause</button>
        <button id="snap" title="Download a PNG">📸 Snapshot</button>
        <button id="copy" title="Copy the frame as text">📋 Copy text</button>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status"></div>

  <script src="app.js"></script>
</body>
</html>
